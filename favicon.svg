<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="stadiumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#168C98" />
      <stop offset="60%" stop-color="#173B5E" />
      <stop offset="100%" stop-color="#10283F" />
    </linearGradient>
    <linearGradient id="batGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3A852" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
  </defs>
  <!-- Background circle for sharp icon visibility -->
  <circle cx="50" cy="50" r="48" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Green Swoosh / Leaf Element -->
  <path d="M 28 46 C 26 28, 48 24, 56 34 C 44 32, 34 38, 30 46 Z" fill="url(#swooshGrad)" />
  
  <!-- Stadium Bowl -->
  <ellipse cx="52" cy="56" rx="28" ry="16" fill="none" stroke="url(#stadiumGrad)" stroke-width="6"/>
  <ellipse cx="52" cy="56" rx="22" ry="11" fill="#E0F2FE" />
  
  <!-- Cricket Bat -->
  <g transform="rotate(42 48 42)">
    <!-- Handle -->
    <rect x="46.5" y="16" width="3" height="12" rx="1.5" fill="#78350F" />
    <rect x="46" y="24" width="4" height="4" rx="1" fill="#FFFFFF" />
    <!-- Blade -->
    <path d="M 44.5 28 C 44.5 28, 51.5 28, 51.5 28 C 52 35, 51 48, 48 54 C 45 48, 44 35, 44.5 28 Z" fill="url(#batGrad)" stroke="#B45309" stroke-width="0.8"/>
  </g>
  
  <!-- Cricket Ball with seam -->
  <circle cx="49" cy="54" r="5.5" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
  <path d="M 45 54 C 47 51, 51 51, 53 54" stroke="#DC2626" stroke-dasharray="1.2,1" stroke-width="0.8" fill="none"/>
  
  <!-- Brand text badge -->
  <rect x="22" y="72" width="56" height="13" rx="4" fill="#173B5E"/>
  <text x="50" y="81.5" font-family="Arial, sans-serif" font-weight="900" font-size="7.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">UP16 ARENA</text>
</svg>
